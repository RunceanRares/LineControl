name: .NET CI Pipeline

# Pipeline-ul pornește la fiecare Push pe ramura main
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Copiază codul de pe GitHub pe serverul de build
    - uses: actions/checkout@v4

    # 2. Instalează mediul .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0
    
    - name: Add or Update Telerik NuGet Source
      run: |
       dotnet nuget add source https://nuget.telerik.com/v3/index.json -n Telerik -u ${{ secrets.TELERIK_USERNAME }} -p ${{ secrets.TELERIK_PASSWORD }} --store-password-in-clear-text || dotnet nuget update source Telerik -u ${{ secrets.TELERIK_USERNAME }} -p ${{ secrets.TELERIK_PASSWORD }} --store-password-in-clear-text

    # 3. Descarcă bibliotecile (NuGet packages)
    - name: Restore dependencies
      run: dotnet restore --ignore-failed-sources

    # 4. Compilează codul (Build)
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # 5. Rulează testele (dacă ai proiect de teste)
    - name: Test
      run: dotnet test --no-build --verbosity normal